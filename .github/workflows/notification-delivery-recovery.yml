
name: Notification Delivery Recovery

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Trigger notification recovery endpoint
        env:
          NOTIFICATION_RECOVERY_CRON_SECRET: ${{ secrets.NOTIFICATION_RECOVERY_CRON_SECRET }}
        run: |
          test -n "$NOTIFICATION_RECOVERY_CRON_SECRET"

          curl --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 120 \
            --request POST \
            "https://doctor-appointment-booking-20rh.onrender.com/api/v1/internal/notification-deliveries/run" \
            --header "Authorization: Bearer ${NOTIFICATION_RECOVERY_CRON_SECRET}"
